# Code style of the project: PEP 8 with lines of up to 120 characters (a project decision;
# PEP 8 itself suggests 79). Read by pycodestyle, flake8 and isort when they are used.
# The tests run with pytest (requirements-dev.txt):  venv\Scripts\python -m pytest
[tool:pytest]
testpaths = tests
pythonpath = . tests
addopts = -p no:cacheprovider

[pycodestyle]
max-line-length = 120

[flake8]
max-line-length = 120

[isort]
line_length = 120
